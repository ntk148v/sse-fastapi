[project]
name = "sse-fastapi"
version = "0.1.0"
description = "Server-sent events (SSE) example using FastAPI"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[tool.uv]
exclude = ["dev-dependencies"]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
]
